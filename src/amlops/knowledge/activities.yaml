  M5: Tune Model
  M6: Validate Model
  M7: Evaluate/Test Model
  M8: Optimize Model
  M9: Register Model
Soft:
  S1: Develop Code
  S2: Build Components
  S3: Package Artifacts
  S4: Test Solution
  S5: Release Solution
Ops:
  O1: Configure CI/CD
  O2: Manage Infrastructure
  O3: Execute Pipelines
