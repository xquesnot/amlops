levels:
  L0:
    label: no constraint
    required: []
  L1:
    label: EU-headquartered provider
    required:
    - EUHQ
  L2:
    label: HDS certified
    required:
    - HDS
  L3:
    label: HDS and EU-headquartered
    required:
    - HDS
    - EUHQ
  L4:
    label: SecNumCloud qualified
    required:
    - SecNumCloud
notes:
- Outscale publishes unit prices per vCore and GiB; CPU and GPU host prices are derived (see prices_labels.md). Outscale offers an L40, not an
  L4.
- Outscale power and embedded emissions are proxied by the Scaleway instance of the same size (Outscale is not covered by BoaviztAPI); the L40
  by the Scaleway L40S.
- All L4 offers use the BoaviztAPI Scaleway L4-1-24G power and embedded figures (same GPU model); the AWS g6 archetype in BoaviztAPI reports a
  lower GPU power.
- OVHcloud l4-90 in Limburg is excluded (availability not confirmed on official pages). Scaleway has no GPU in nl-ams.
- 'HDS: provider-level certifications for Scaleway, OVHcloud (option on project), AWS; Outscale only for cloudgouv-eu-west-1 in this study. Per-region
  HDS scope of Scaleway not found.'
- 'SecNumCloud: only Outscale cloudgouv-eu-west-1 among priced public offers (ANSSI catalogue of 15/09/2026; validity until 30/11/2026).'
